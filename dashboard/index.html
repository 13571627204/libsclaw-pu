<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="keywords" content="LibsClaw" />
    <meta name="description" content="LibsClaw Dashboard" />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
      }
      .app-boot-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7fafc;
        color: #52606d;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .app-boot-indicator {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .app-boot-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #d9e8f2;
        border-top-color: #278dcc;
        border-radius: 50%;
        animation: app-boot-spin 0.7s linear infinite;
      }
      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        .app-boot-shell { background: #101820; color: #c5d0da; }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner { animation: none; }
      }
    </style>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit&family=Noto+Sans:wght@100..900&display=swap"
    />
    <title>LibsClaw - 仪表盘</title>
  </head>
  <body>
    <div id="app">
      <div class="app-boot-shell" role="status" aria-live="polite">
        <div class="app-boot-indicator">
          <span class="app-boot-spinner" aria-hidden="true"></span>
          <span>正在快速加载…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
